<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · xPaste</title>
<meta name="description" content="这个页面不存在。">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<style>
:root { color-scheme: dark; --bg: #000000; --s1: #181818; --s3: #272727; --fg: #F2F2F2; --muted: #A3A3A3; --beam: #8FE3FF; --on-beam: #06101C; --base: cubic-bezier(.22, 1, .36, 1); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/24px "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 680px; margin: 0 auto; padding: 96px 16px; }
a { color: var(--beam); }
:focus-visible { outline: 2px solid var(--beam); outline-offset: 2px; border-radius: 8px; }
.back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; font-size: 14px; line-height: 20px; transition: color .3s var(--base); }
.back:hover { color: var(--fg); }
.back img { width: 24px; height: 24px; }
h1 { margin: 32px 0 0; font-size: 36px; line-height: 40px; font-weight: 600; text-wrap: balance; background: linear-gradient(90deg, #FFFFFF, #9B9B9B); -webkit-background-clip: text; background-clip: text; color: transparent; }
h2 { margin: 48px 0 0; font-size: 20px; line-height: 28px; font-weight: 600; }
p, li { color: var(--muted); text-wrap: pretty; }
p { margin: 16px 0 0; }
ul { margin: 16px 0 0; padding-left: 24px; }
li + li { margin-top: 8px; }
code { font: 14px/20px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--fg); }
.btn { display: inline-flex; margin-top: 32px; padding: 8px 12px; border-radius: 9999px; background: var(--beam); color: var(--on-beam); font-weight: 600; text-decoration: none; transition: transform .5s var(--base); }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.98); }
</style>
</head>
<body>
<main>
<a class="back" href="index.html"><img src="assets/logo.svg" alt="" width="24" height="24">返回 xPaste 首页</a>
<h1>这一页没有被复制下来</h1>
<p>你要找的页面不存在，可能是链接写错了，或者页面已经移走。</p>
<a class="btn" href="index.html">回到首页</a>
</main>
</body>
</html>
