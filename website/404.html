<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · xPaste</title>
<meta name="description" content="这个页面不存在。">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<meta name="color-scheme" content="light dark">
<style>
/* 与首页同一套「刻度」取值：系统中性灰、系统字体，一根品牌青 */
:root { color-scheme: light dark; --bg: #F5F5F7; --surface: #FFFFFF; --raised: #ECECEF; --line-2: rgb(0 0 0 / .14); --fg: #1D1D1F; --muted: #5C5C64; --accent: #0E7FA3; --accent-hover: #0B6E8E; --accent-ink: #0B6E8E; --ease: cubic-bezier(.22, 1, .36, 1); }
@media (prefers-color-scheme: dark) { :root { --bg: #1C1C1E; --surface: #242426; --raised: #2C2C2F; --line-2: rgb(255 255 255 / .14); --fg: #ECECEE; --muted: #ABABB2; --accent: #23809F; --accent-hover: #2B8CAE; --accent-ink: #6BB6CF; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/26px -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 680px; margin: 0 auto; padding: 96px 16px; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; border-radius: 6px; }
.back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; font-size: 14px; line-height: 20px; transition: color .15s var(--ease); }
.back:hover { color: var(--fg); }
.back img { width: 24px; height: 24px; }
h1 { margin: 32px 0 0; font-size: 36px; line-height: 44px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
h2 { margin: 48px 0 0; font-size: 20px; line-height: 28px; font-weight: 600; }
p, li { color: var(--muted); text-wrap: pretty; }
p { margin: 16px 0 0; }
ul { margin: 16px 0 0; padding-left: 24px; }
li + li { margin-top: 8px; }
code { font: 13px/20px ui-monospace, "SF Mono", Menlo, "Cascadia Mono", Consolas, monospace; color: var(--fg); overflow-wrap: anywhere; }
.btn { display: inline-flex; align-items: center; height: 44px; margin-top: 32px; padding: 0 20px; border-radius: 10px; background: var(--accent); color: #FFFFFF; font-weight: 500; font-size: 15px; text-decoration: none; transition: background-color .15s var(--ease), transform .15s var(--ease); }
.btn:hover { background: var(--accent-hover); }
.btn:active { transform: scale(.98); }
</style>
</head>
<body>
<main>
<a class="back" href="index.html"><img src="assets/logo.svg" alt="" width="24" height="24">返回 xPaste 首页</a>
<h1>这一页没有被复制下来</h1>
<p>你要找的页面不存在，可能是链接写错了，或者页面已经移走。</p>
<a class="btn" href="index.html">回到首页</a>
</main>
</body>
</html>
