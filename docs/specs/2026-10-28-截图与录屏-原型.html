<!doctype html>
<!--
  xPaste 截图与录屏 交互原型（阶段 12 / 13，依据 2026-10-28-截图与录屏-设计.md）
  本地打开即可，不发布。整页是一块模拟桌面（canvas 画出来的），底部浮条是原型控制台，不属于“屏幕”。
  模拟了：冻结画面、窗口吸附、框选 / 调整、放大镜、7 种标注、撤销重做、复制（真的写进剪切板）、
  保存（真的下载 PNG）、识别文字（按画面里的文字生成）、录屏选区 / 倒计时 / 录制边框 / 托盘计时 / 停止、
  屏幕录制权限提示、新增设置项、贴图（钉在屏幕上：拖动、滚轮缩放、双击关闭、右键菜单，会被之后的截图截进去）。
  没模拟：多显示器（其他屏只显示暗色蒙层）、真实的系统权限与文件夹选择。
-->
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xPaste 截图与录屏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 设计变量取自面板原型 docs/xpaste-prototype.html 的 :root（M16）。
   选区框取“产出物”的类型色：截图 → 图片色，录屏 → 视频色，与面板里“高亮框换成该类型色”一致。 */
:root {
  color-scheme: dark;
  --ink: #06080F;
  --glass: rgb(15 19 34 / .68);
  --glass-2: rgb(255 255 255 / .035);
  --glass-3: rgb(255 255 255 / .07);
  --line: rgb(170 190 255 / .09);
  --line-2: rgb(170 190 255 / .17);
  --fg: #EAF0FF; --muted: #9AA4CB; --faint: #646E94;
  --c-text: #8FE3FF; --c-link: #6F8BFF; --c-code: #4FE3C1; --c-color: #FF6FD8;
  --c-image: #FFB84D; --c-video: #FF6B6B; --c-file: #B48CFF; --c-fav: #D9F26B;
  --beam: #8FE3FF; --beam-hover: #B4EEFF; --on-beam: #06101C; --on-rec: #1A0507; --danger: #FF6B81;
  --well: rgb(0 0 0 / .22);
  --pop: rgb(14 18 32 / .94); --pop-solid: #12162A;
  --hover: rgb(255 255 255 / .11);
  --shadow-win: 0 50px 120px -30px rgb(0 0 0 / .85), inset 0 1px 0 rgb(255 255 255 / .07);
  --shadow-pop: 0 24px 60px -16px rgb(0 0 0 / .9);
  --scrim: rgb(3 5 12 / .55);
  --track-off: rgb(255 255 255 / .1); --knob: #EAF0FF;
  --swatch-ring: rgb(255 255 255 / .15);
  --glow-a: rgb(143 227 255 / .75);
  --spectrum: linear-gradient(90deg, var(--c-text), var(--c-link) 28%, var(--c-code) 44%, var(--c-color) 58%, var(--c-image) 72%, var(--c-video) 86%, var(--c-file));
  --ease-enter: cubic-bezier(.22, 1, .36, 1);
  --ease-move: cubic-bezier(.25, 1, .5, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --font-display: "Unbounded", "Geist", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-ui: "Geist", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, "Microsoft YaHei", monospace;
  /* 截图蒙层与主题无关：压暗的是用户的屏幕，不是 xPaste 的界面 */
  --dim: rgb(0 0 0 / .46);
}
html[data-theme="light"] {
  color-scheme: light;
  --ink: #EDF0F8;
  --glass: rgb(255 255 255 / .62);
  --glass-2: rgb(20 30 80 / .035);
  --glass-3: rgb(20 30 80 / .06);
  --line: rgb(30 45 110 / .09);
  --line-2: rgb(30 45 110 / .16);
  --fg: #111632; --muted: #545C7C; --faint: #8790AE;
  --c-text: #0891B2; --c-link: #3B5BDB; --c-code: #0D9488; --c-color: #C026D3;
  --c-image: #D97706; --c-video: #E03131; --c-file: #7C3AED; --c-fav: #4D7C0F;
  --beam: #0E7FA3; --beam-hover: #0B6A88; --on-beam: #FFFFFF; --on-rec: #FFFFFF; --danger: #D6334F;
  --well: rgb(20 30 80 / .04);
  --pop: rgb(255 255 255 / .94); --pop-solid: #FFFFFF;
  --hover: rgb(20 30 80 / .07);
  --shadow-win: 0 40px 100px -30px rgb(40 50 110 / .35), inset 0 1px 0 rgb(255 255 255 / .9);
  --shadow-pop: 0 20px 50px -18px rgb(40 50 110 / .35);
  --scrim: rgb(20 28 60 / .22);
  --track-off: rgb(20 30 80 / .12); --knob: #FFFFFF;
  --swatch-ring: rgb(20 30 80 / .14);
  --glow-a: rgb(14 127 163 / .55);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0B1030; }
body { font: 14px/1.5 var(--font-ui); color: var(--fg); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--beam); outline-offset: 2px; }
.ic { width: 16px; height: 16px; flex: none; display: block; }
kbd {
  font: 500 11px/1 var(--font-mono);
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 5px;
  color: var(--muted); background: var(--glass-2); border: 1px solid var(--line-2);
}
@keyframes rowIn { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } }
@keyframes popIn { from { opacity: 0; transform: translateY(4px); filter: blur(3px); } }
@keyframes fadeIn { from { opacity: 0; } }

/* —— 模拟桌面 —— */
#desk { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* —— 截图 / 录屏遮罩 —— */
#ov { position: fixed; inset: 0; z-index: 1000; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; cursor: crosshair; }
#ov[data-mode="shot"] { --tc: var(--c-image); }
#ov[data-mode="rec"] { --tc: var(--c-video); }
#ov > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ov.out { opacity: 0; transition: opacity 160ms ease-out; pointer-events: none; }

/* 选区：自身透明，靠超大外阴影压暗四周；边框画在选区外侧，不压住被截的像素 */
#cut { position: absolute; pointer-events: none; box-shadow: 0 0 0 200vmax var(--dim); }
#ov.in #cut { animation: dimIn 90ms var(--ease-enter) both; }
@keyframes dimIn { from { box-shadow: 0 0 0 200vmax transparent; } }
#cut::before {
  content: ""; position: absolute; inset: -1.5px; border: 1.5px solid var(--tc);
  box-shadow: 0 0 0 1px rgb(0 0 0 / .28), 0 0 22px -4px color-mix(in srgb, var(--tc) 70%, transparent);
}
#cut.snap::before { inset: -2px; border-width: 2px; }
#cut .h {
  position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%;
  background: var(--tc); box-shadow: 0 0 0 2px #fff, 0 1px 4px rgb(0 0 0 / .45);
  pointer-events: auto; display: none;
}
#ov[data-phase="selected"] #cut .h { display: block; }
#cut .h::after { content: ""; position: absolute; inset: -7px; } /* 放大可点范围 */
.h[data-h="nw"] { left: 0; top: 0; cursor: nwse-resize; }
.h[data-h="n"]  { left: 50%; top: 0; cursor: ns-resize; }
.h[data-h="ne"] { left: 100%; top: 0; cursor: nesw-resize; }
.h[data-h="e"]  { left: 100%; top: 50%; cursor: ew-resize; }
.h[data-h="se"] { left: 100%; top: 100%; cursor: nwse-resize; }
.h[data-h="s"]  { left: 50%; top: 100%; cursor: ns-resize; }
.h[data-h="sw"] { left: 0; top: 100%; cursor: nesw-resize; }
.h[data-h="w"]  { left: 0; top: 50%; cursor: ew-resize; }
/* 复制成功：一道类型色光扫过选区（M20“复制成功”的同一语言，缩短到 320 ms 以便尽快退出） */
#cut .sweep { position: absolute; inset: 0; overflow: hidden; }
#cut .sweep::before {
  content: ""; position: absolute; top: 0; bottom: 0; width: 45%; left: -45%;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--tc) 55%, transparent), transparent);
  animation: sweep 320ms var(--ease-move) forwards;
}
@keyframes sweep { to { left: 100%; } }

/* 尺寸标签：数字用品牌字 Unbounded（M16 规则 4） */
.badge {
  position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
  font: 500 11px/1 var(--font-display); letter-spacing: .02em; font-variant-numeric: tabular-nums;
  padding: 6px 8px; border-radius: 7px; color: var(--fg);
  background: var(--pop); border: 1px solid var(--line-2);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--tc); box-shadow: 0 0 8px var(--tc); }
.badge .x { color: var(--faint); }
.badge .fps { font: 500 11px/1 var(--font-ui); color: var(--muted); }

/* 放大镜与十字参考线 */
.gx, .gy { position: absolute; left: 0; top: 0; pointer-events: none; background: color-mix(in srgb, var(--tc) 45%, transparent); }
.gx { width: 100%; height: 1px; }
.gy { width: 1px; height: 100%; }
.loupe {
  position: absolute; left: 0; top: 0; width: 124px; pointer-events: none; border-radius: 12px; overflow: hidden;
  background: var(--pop); border: 1px solid var(--line-2); box-shadow: var(--shadow-pop);
}
.loupe canvas { display: block; width: 122px; height: 122px; }
.loupe .info { font: 500 11px/1 var(--font-mono); color: var(--muted); padding: 7px 9px 8px; display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }

/* 工具栏 */
.bar {
  position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 2px; padding: 4px;
  border-radius: 12px; background: var(--pop); border: 1px solid var(--line-2); box-shadow: var(--shadow-pop);
  -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%);
  cursor: default;
}
.bar.pop-in { animation: popIn 180ms var(--ease-enter) both; }
.bar button {
  position: relative; width: 32px; height: 32px; border: 0; border-radius: 8px; padding: 0;
  background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer;
  transition: background-color 130ms ease, color 130ms ease, transform 140ms var(--ease-enter);
}
.bar button:active:not([aria-disabled="true"]) { transform: scale(.92); }
.bar button[aria-pressed="true"] { background: color-mix(in srgb, var(--beam) 16%, transparent); color: var(--beam); }
.bar button[aria-disabled="true"] { opacity: .35; cursor: default; }
@media (hover: hover) and (pointer: fine) {
  .bar button:hover:not([aria-disabled="true"]):not([aria-pressed="true"]) { background: var(--hover); color: var(--fg); }
}
.bar .sep { width: 1px; height: 18px; background: var(--line-2); margin: 0 4px; flex: none; }
.bar .go {
  width: auto; padding: 0 8px 0 12px; gap: 8px; display: inline-flex; margin-left: 2px;
  background: var(--beam); color: var(--on-beam); font-weight: 600; font-size: 13px;
  box-shadow: 0 6px 20px -8px color-mix(in srgb, var(--beam) 70%, transparent);
}
.bar .go kbd { background: color-mix(in srgb, var(--on-beam) 14%, transparent); border-color: color-mix(in srgb, var(--on-beam) 30%, transparent); color: var(--on-beam); }
@media (hover: hover) and (pointer: fine) { .bar .go:hover { background: var(--beam-hover) !important; color: var(--on-beam) !important; } }
#ov[data-mode="rec"] .bar .go { background: var(--c-video); color: var(--on-rec); box-shadow: 0 6px 20px -8px color-mix(in srgb, var(--c-video) 70%, transparent); }
#ov[data-mode="rec"] .bar .go kbd { color: var(--on-rec); background: color-mix(in srgb, var(--on-rec) 12%, transparent); border-color: color-mix(in srgb, var(--on-rec) 28%, transparent); }
@media (hover: hover) and (pointer: fine) { #ov[data-mode="rec"] .bar .go:hover { background: color-mix(in srgb, var(--c-video) 85%, #fff) !important; color: var(--on-rec) !important; } }
.go .rd { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

/* 悬停提示：名称 + 按键 */
.bar [data-tip]::after {
  content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 9px); z-index: 2;
  transform: translate(-50%, 4px); white-space: nowrap; pointer-events: none;
  font: 500 12px/1 var(--font-ui); padding: 6px 8px; border-radius: 7px;
  background: var(--pop-solid); border: 1px solid var(--line-2); color: var(--fg); box-shadow: var(--shadow-pop);
  opacity: 0; transition: opacity 120ms ease-out, transform 120ms ease-out;
}
.bar.below-tips [data-tip]::after { bottom: auto; top: calc(100% + 9px); transform: translate(-50%, -4px); }
@media (hover: hover) and (pointer: fine) {
  .bar [data-tip]:hover::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 380ms; }
}

/* 颜色 / 粗细 */
.sub { gap: 4px; padding: 4px 6px; }
.sw { width: 26px !important; height: 26px !important; }
.sw i { width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px var(--swatch-ring); transition: transform 200ms var(--ease-spring); }
.sw[aria-pressed="true"] { background: transparent !important; }
.sw[aria-pressed="true"] i { transform: scale(1.12); box-shadow: 0 0 0 2px var(--pop-solid), 0 0 0 3.5px var(--c); }
.sz { width: 26px !important; height: 26px !important; }
.sz i { border-radius: 50%; background: currentColor; }
.sz b { font: 600 var(--fs, 12px)/1 var(--font-ui); }

/* 进行中提示（识别文字） */
.busy { padding: 0 14px; height: 42px; gap: 10px; font-size: 13px; color: var(--muted); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--beam) 25%, transparent); border-top-color: var(--beam); animation: spin 700ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 左下角操作提示 */
.hintbar {
  position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 8px 12px; border-radius: 10px; font-size: 12px; color: var(--muted); pointer-events: none;
  background: var(--pop); border: 1px solid var(--line-2); box-shadow: var(--shadow-pop);
  animation: fadeIn 200ms ease-out 120ms both;
}
.hintbar b { font-weight: 500; color: var(--fg); }
.hintbar span { display: inline-flex; align-items: center; gap: 6px; }

/* 文字标注输入框 */
.txt {
  position: absolute; margin: 0; padding: 2px 4px; min-width: 24px; min-height: 1em;
  border: 1px dashed color-mix(in srgb, var(--fg) 60%, transparent); border-radius: 3px;
  background: rgb(0 0 0 / .08); outline: none; white-space: pre; cursor: text;
  font-family: var(--font-ui); font-weight: 600; line-height: 1.25; caret-color: currentColor;
}

/* 录屏倒计时 */
.count { position: absolute; display: grid; place-items: center; width: 150px; height: 150px; pointer-events: none; }
.count svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.count circle { fill: rgb(0 0 0 / .45); stroke: rgb(255 255 255 / .18); stroke-width: 4; }
.count .prg { fill: none; stroke: var(--c-video); stroke-linecap: round; stroke-dasharray: 427; animation: ring 1000ms linear forwards; }
@keyframes ring { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 427; } }
.count b { position: relative; font: 700 64px/1 var(--font-display); color: #fff; animation: cdIn 420ms var(--ease-spring) both; }
.count small { position: absolute; top: calc(100% + 10px); white-space: nowrap; font-size: 12px; color: #fff; opacity: .8; text-shadow: 0 1px 6px rgb(0 0 0 / .6); }
@keyframes cdIn { from { opacity: 0; transform: scale(.55); } }

/* —— 贴图：钉在屏幕最上层的截图（M23）。z-index 从 15 往上递增，始终低于遮罩 —— */
.pin {
  position: fixed; z-index: 15; border-radius: 6px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  box-shadow: 0 18px 50px -12px rgb(0 0 0 / .6), 0 0 0 1px rgb(255 255 255 / .14);
  transition: box-shadow 160ms ease;
}
.pin img { display: block; width: 100%; height: 100%; border-radius: inherit; pointer-events: none; }
.pin:hover, .pin:focus-visible { outline: none; box-shadow: 0 18px 50px -12px rgb(0 0 0 / .6), 0 0 0 1.5px var(--c-image), 0 0 20px -4px color-mix(in srgb, var(--c-image) 60%, transparent); }
.pin.drag { cursor: grabbing; box-shadow: 0 28px 70px -14px rgb(0 0 0 / .7), 0 0 0 1.5px var(--c-image); }
.pin.lift { animation: lift 240ms var(--ease-enter) both; }
@keyframes lift { from { box-shadow: 0 0 0 0 transparent, 0 0 0 1.5px var(--c-image); } }
.pin.out { opacity: 0; transform: scale(.96); transition: opacity 120ms ease-out, transform 120ms ease-out; }
.pin .zoom {
  position: absolute; right: 8px; top: 8px; pointer-events: none;
  font: 500 11px/1 var(--font-display); font-variant-numeric: tabular-nums; padding: 5px 7px; border-radius: 6px;
  color: var(--fg); background: var(--pop); border: 1px solid var(--line-2);
  opacity: 0; transition: opacity 200ms ease-out;
}
.pin .zoom.on { opacity: 1; transition-duration: 0s; }

/* —— 录制中：选区外侧的边框（点击穿透，不被录进去）与托盘计时 —— */
#recFrame {
  position: fixed; z-index: 6; pointer-events: none; border-radius: 3px;
  box-shadow: 0 0 0 2px var(--c-video), 0 0 26px -4px color-mix(in srgb, var(--c-video) 70%, transparent);
  animation: fadeIn 200ms ease-out both;
}
#recFrame.out { opacity: 0; transition: opacity 200ms ease-out; }
#recTray {
  position: fixed; top: 3px; z-index: 7; height: 20px; padding: 0 8px; border: 0; border-radius: 6px;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  font: 500 12px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: #fff;
  background: color-mix(in srgb, #FF6B6B 30%, rgb(0 0 0 / .35));
}
#recTray i { width: 7px; height: 7px; border-radius: 50%; background: #FF6B6B; box-shadow: 0 0 8px #FF6B6B; animation: blink 1200ms ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* 菜单（托盘菜单） */
.menu {
  position: fixed; z-index: 1001; min-width: 190px; padding: 5px; border-radius: 12px;
  background: var(--pop); border: 1px solid var(--line-2); box-shadow: var(--shadow-pop);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  transform-origin: top right; animation: menuIn 260ms var(--ease-spring) both;
}
@keyframes menuIn { from { opacity: 0; transform: scale(.92); } }
.menu button { width: 100%; display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 9px; border: 0; border-radius: 8px; background: transparent; font-size: 13px; cursor: pointer; text-align: left; }
.menu button kbd { margin-left: auto; }
.menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--beam) 12%, transparent); outline: none; }
.menu .info { padding: 6px 9px 4px; font-size: 12px; color: var(--faint); }
.menu .sep { height: 1px; background: var(--line-2); margin: 5px 7px; }

/* —— 原型控制台（不属于模拟屏幕） —— */
.dock {
  position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 8;
  display: flex; align-items: center; gap: 8px; padding: 8px; max-width: calc(100% - 32px); overflow-x: auto;
  border-radius: 16px; background: var(--glass); border: 1px solid var(--line-2); box-shadow: var(--shadow-win);
  -webkit-backdrop-filter: blur(24px) saturate(150%); backdrop-filter: blur(24px) saturate(150%);
  scrollbar-width: none;
}
.dock .mark { display: flex; align-items: center; gap: 9px; padding: 0 6px 0 4px; white-space: nowrap; }
.dock .mark .bars { display: flex; gap: 2.5px; align-items: flex-end; height: 16px; }
.dock .mark .bars i { width: 3px; border-radius: 2px; background: var(--tc); box-shadow: 0 0 8px color-mix(in srgb, var(--tc) 70%, transparent); }
.dock .mark b { font: 700 13px/1 var(--font-display); letter-spacing: -.01em; }
.dock .mark small { font-size: 11.5px; color: var(--faint); }
.dock .vsep { width: 1px; align-self: stretch; margin: 4px 2px; background: var(--line-2); flex: none; }
.btn {
  height: 32px; padding: 0 10px; border-radius: 9px; cursor: pointer; white-space: nowrap; flex: none;
  display: inline-flex; align-items: center; gap: 7px; font-size: 13px;
  border: 1px solid var(--line-2); background: var(--glass-3); color: var(--fg);
  transition: transform 140ms var(--ease-enter), background-color 160ms ease, border-color 160ms ease, color 160ms ease;
}
.btn:active:not(:disabled) { transform: scale(.96); }
.btn kbd { margin-left: 1px; }
.btn kbd + kbd { margin-left: 2px; }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.primary { background: var(--beam); color: var(--on-beam); border-color: transparent; font-weight: 600; }
.btn.rec-on { border-color: color-mix(in srgb, var(--c-video) 50%, transparent); color: var(--c-video); }
.btn[aria-pressed="false"].state { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
@media (hover: hover) and (pointer: fine) {
  .btn:hover:not(:disabled) { background: var(--hover); }
  .btn.primary:hover { background: var(--beam-hover); }
  .btn.ghost:hover { color: var(--fg); background: var(--glass-3); }
}
.hist { display: flex; gap: 6px; align-items: center; min-height: 34px; }
.hist .empty { font-size: 12px; color: var(--faint); padding: 0 6px; white-space: nowrap; }
.tile { position: relative; width: 48px; height: 34px; border-radius: 7px; overflow: hidden; flex: none; background: var(--well); box-shadow: inset 0 0 0 1px var(--line-2); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--tc); box-shadow: 0 0 8px var(--tc); }
.tile[data-type="image"] { --tc: var(--c-image); }
.tile[data-type="video"] { --tc: var(--c-video); }
.tile .play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; }
.tile .play svg { width: 14px; height: 14px; filter: drop-shadow(0 1px 3px rgb(0 0 0 / .6)); }
.tile.new { animation: tileIn 520ms var(--ease-spring) both; }
@keyframes tileIn { from { opacity: 0; transform: translateY(8px) scale(.8); } }

/* —— 提示条（M20：弹性进入、同方向退出） —— */
.toast {
  position: fixed; left: 50%; bottom: 76px; z-index: 9;
  display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px);
  padding: 7px 14px 7px 7px; border-radius: 12px; font-size: 13px;
  background: var(--pop); border: 1px solid var(--line-2); box-shadow: var(--shadow-pop);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  opacity: 0; transform: translate(-50%, 8px) scale(.96); visibility: hidden;
  transition: opacity 160ms ease-out, transform 160ms ease-out, visibility 0s 160ms;
}
.toast[data-open="true"] { opacity: 1; transform: translate(-50%, 0); visibility: visible; transition: opacity 220ms var(--ease-enter), transform 420ms var(--ease-spring), visibility 0s; }
.toast .t-th { width: 40px; height: 28px; border-radius: 6px; object-fit: cover; box-shadow: inset 0 0 0 1px var(--line-2); flex: none; }
.toast .t-ic { width: 28px; height: 28px; display: grid; place-items: center; color: var(--c-code); flex: none; }
.toast .t-msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* —— 对话框（同面板设置对话框） —— */
dialog {
  width: min(460px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line-2); border-radius: 18px;
  background: var(--pop); -webkit-backdrop-filter: blur(28px) saturate(150%); backdrop-filter: blur(28px) saturate(150%);
  color: var(--fg); box-shadow: var(--shadow-pop); overscroll-behavior: contain;
  opacity: 0; transform: scale(.94) translateY(10px);
  transition: opacity 150ms ease-out, transform 150ms ease-out;
}
dialog.is-shown { opacity: 1; transform: none; transition: opacity 220ms var(--ease-enter), transform 420ms var(--ease-spring); }
dialog::backdrop { background: var(--scrim); opacity: 0; transition: opacity 150ms ease-out; }
dialog.is-shown::backdrop { opacity: 1; transition: opacity 220ms var(--ease-enter); }
dialog.is-shown .dlg-body > * { animation: rowIn 460ms var(--ease-enter) both; animation-delay: calc(60ms + var(--i, 0) * 45ms); }
#settings { width: min(520px, calc(100% - 32px)); max-height: calc(100% - 48px); }

.sec { margin: 4px 0 -6px; font-size: 11.5px; font-weight: 500; color: var(--faint); letter-spacing: .04em; }
.field { display: grid; gap: 7px; min-width: 0; }
.field label { font-size: 13px; font-weight: 500; }
.field input {
  height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2);
  background: var(--well); color: var(--fg); font: inherit; min-width: 0; width: 100%;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.field input:focus-visible { outline: none; border-color: var(--beam); box-shadow: 0 0 0 3px color-mix(in srgb, var(--beam) 18%, transparent); }
.hk { font-family: var(--font-mono) !important; cursor: pointer; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; font: 12.5px var(--font-mono) !important; color: var(--muted) !important; }
.help { margin: 0; font-size: 12px; color: var(--faint); }
.switches { display: grid; border-top: 1px solid var(--line); }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.switch b { display: block; font-weight: 500; font-size: 13px; }
.switch small { display: block; font-size: 12px; color: var(--faint); }
.switch input {
  appearance: none; margin: 0; flex: none; position: relative; cursor: pointer;
  width: 38px; height: 22px; border-radius: 999px; background: var(--track-off); border: 1px solid var(--line-2);
  transition: background-color 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
}
.switch input::after {

.switch input:checked::after { transform: translateX(16px); background: var(--on-beam); }
.switch input:disabled { opacity: .4; cursor: not-allowed; }

<script>
'use strict';
const $ = s => document.querySelector(s);
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
const dpr = () => window.devicePixelRatio || 1;
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.rm === 'on';

/* —— 图标（24 视框，1.8 描边） —— */
const ICON = {
  rect: '<rect x="4" y="5.5" width="16" height="13" rx="2"/>',
  ellipse: '<ellipse cx="12" cy="12" rx="8.5" ry="6.5"/>',

  save: '<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>',

  micOff: '<rect x="9" y="3.5" width="6" height="10.5" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/><path d="M4 4l16 16"/>',

  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
  motion: '<path d="M4 12h3l2-5 3 10 2-5h6"/>',

  copy: '<rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/><path d="M15.5 8.5V5.5A1.5 1.5 0 0 0 14 4H5.5A1.5 1.5 0 0 0 4 5.5V14a1.5 1.5 0 0 0 1.5 1.5h3"/>',

const svg = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const paintIcons = (root = document) => root.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = svg(el.dataset.icon); el.style.display = 'inline-grid'; });

/* —— 快捷键：与 src/hotkey.ts 的格式一致（CommandOrControl+Control+Alt+Shift+KEY） —— */
const HK = { shot: 'Alt+Shift+A', rec: 'Alt+Shift+R' };
const MODK = isMac ? '⌘' : 'Ctrl';
function parseHK(s) {
  const h = { mod: false, ctrl: false, alt: false, shift: false, key: '' };
  for (const t of s.split('+').map(x => x.trim().toLowerCase())) {
    if (t === 'commandorcontrol') h.mod = true; else if (t === 'control') h.ctrl = true;
    else if (t === 'alt') h.alt = true; else if (t === 'shift') h.shift = true; else if (t) h.key = t.toUpperCase();
  }
  return h;
}
function hkLabel(s) {
  if (!s) return '未启用';
  const h = parseHK(s);
  return [h.mod && (isMac ? '⌘' : 'Ctrl'), h.ctrl && (isMac ? '⌃' : !h.mod && 'Ctrl'), h.alt && (isMac ? '⌥' : 'Alt'), h.shift && 'Shift', h.key].filter(Boolean).join(' + ');
}
function hkChips(s) {
  if (!s) return '';
  const h = parseHK(s);
  return [h.mod && (isMac ? '⌘' : 'Ctrl'), h.ctrl && (isMac ? '⌃' : 'Ctrl'), h.alt && (isMac ? '⌥' : 'Alt'), h.shift && (isMac ? '⇧' : 'Shift'), h.key].filter(Boolean).map(k => `<kbd>${k}</kbd>`).join('');
}
function hkMatch(e, s) {
  if (!s) return false;
  const h = parseHK(s), k = (/^(?:Key([A-Z])|Digit([0-9]))$/.exec(e.code) || [])[1] || (/^Digit([0-9])$/.exec(e.code) || [])[1];
  const mod = isMac ? e.metaKey : e.ctrlKey, ctrl = isMac ? e.ctrlKey : false;
  return k === h.key && mod === h.mod && ctrl === h.ctrl && e.altKey === h.alt && e.shiftKey === h.shift;
}
function hkFromEvent(e) {
  const k = (/^(?:Key([A-Z])|Digit([0-9])|(F(?:[1-9]|1[0-2])))$/.exec(e.code) || []).slice(1).find(Boolean);
  const mod = isMac ? e.metaKey : e.ctrlKey, ctrl = isMac && e.ctrlKey;
  if (!k || !(mod || ctrl || e.altKey)) return null;
  return [mod && 'CommandOrControl', ctrl && 'Control', e.altKey && 'Alt', e.shiftKey && 'Shift', k].filter(Boolean).join('+');
}
function paintHK() {

function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function T(c, s, x, y, font, color, align = 'left') {

  c.fillText(s, x, y);

  if (s.trim()) TEXTS.push({ s, x: align === 'left' ? x : align === 'center' ? x - w / 2 : x - w, y, w, z: CUR });
  return w;
}
function blob(c, x, y, rad, col) { const g = c.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H); }

function windowChrome(c, b, dark, title) {
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 44; c.shadowOffsetY = 18;
  rr(c, b.x, b.y, b.w, b.h, 11); c.fillStyle = dark ? '#151925' : '#FFFFFF'; c.fill(); c.restore();
  c.save(); rr(c, b.x, b.y, b.w, b.h, 11); c.clip();
  c.fillStyle = dark ? '#1D2230' : '#ECEEF3'; c.fillRect(b.x, b.y, b.w, 32);
  c.fillStyle = dark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.08)'; c.fillRect(b.x, b.y + 32, b.w, 1);
  ['#FF5F57', '#FEBC2E', '#28C840'].forEach((col, i) => { c.beginPath(); c.arc(b.x + 16 + i * 19, b.y + 16, 5.5, 0, 7); c.fillStyle = col; c.fill(); });
  if (title) T(c, title, b.x + b.w / 2, b.y + 20, `500 12px ${UI}`, dark ? '#8A93B5' : '#5A6072', 'center');

/* ============ 截图 / 录屏遮罩 ============ */
const ov = $('#ov'), frozen = $('#frozen'), ink = $('#ink'), ic = ink.getContext('2d');
const cut = $('#cut'), badge = $('#badge'), loupe = $('#loupe'), lc = $('#lc').getContext('2d'), linfo = $('#linfo');
const tb = $('#tb'), sub = $('#sub'), busy = $('#busy'), hint = $('#hint'), count = $('#count'), gx = $('#gx'), gy = $('#gy');

const TOOLS = [['rect', '矩形', '1'], ['ellipse', '椭圆', '2'], ['arrow', '箭头', '3'], ['pen', '画笔', '4'], ['mosaic', '马赛克', '5'], ['text', '文字', '6'], ['step', '序号', '7']];
const COLORS = [['#FF3B47', '红'], ['#FF9F1A', '橙'], ['#22C55E', '绿'], ['#0EA5E9', '蓝'], ['#8B5CF6', '紫'], ['#FFFFFF', '白']];
const STROKE = [2, 4, 7], FONT = [14, 20, 28], STEP_R = [11, 14, 18], MOSAIC = [14, 24, 40];

let S = { open: false };
let FZ = null;               // 冻结帧：画面、马赛克底图、文字位置、窗口
let mouse = { x: innerWidth / 2, y: innerHeight / 2 };
addEventListener('pointermove', e => { mouse = { x: e.clientX, y: e.clientY }; }, { passive: true });

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const inside = (p, r) => r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
const norm = (x0, y0, x1, y1) => { const x = clamp(Math.min(x0, x1), 0, W), y = clamp(Math.min(y0, y1), 0, H); return { x: Math.round(x), y: Math.round(y), w: Math.round(clamp(Math.max(x0, x1), 0, W) - x), h: Math.round(clamp(Math.max(y0, y1), 0, H) - y) }; };

function freeze() {
  drawDesk();
  const f = mk(desk.width, desk.height), fc = f.getContext('2d'), r = dpr();
  fc.drawImage(desk, 0, 0);
  // 贴图是屏幕上的普通窗口：会被截进去，也能被吸附
  fc.setTransform(r, 0, 0, r, 0, 0);
  for (const p of PINS) {
    fc.save(); fc.shadowColor = 'rgba(0,0,0,.55)'; fc.shadowBlur = 40; fc.shadowOffsetY = 16;
    rr(fc, p.x, p.y, p.w * p.k, p.h * p.k, 6); fc.fillStyle = '#000'; fc.fill(); fc.restore();
    fc.save(); rr(fc, p.x, p.y, p.w * p.k, p.h * p.k, 6); fc.clip(); fc.drawImage(p.cv, p.x, p.y, p.w * p.k, p.h * p.k); fc.restore();
  }
  fc.setTransform(1, 0, 0, 1, 0, 0);
  const B = 10 * r, small = mk(Math.ceil(desk.width / B), Math.ceil(desk.height / B));
  small.getContext('2d').drawImage(f, 0, 0, small.width, small.height);
  const pix = mk(desk.width, desk.height), pc = pix.getContext('2d');
  pc.imageSmoothingEnabled = false; pc.drawImage(small, 0, 0, pix.width, pix.height);
  const pins = PINS.map((p, i) => ({ x: p.x, y: p.y, w: Math.round(p.w * p.k), h: Math.round(p.h * p.k), z: 20 + i })).reverse();
  const wins = [...pins, ...[L.menubar, L.browser, L.chat, L.editor].map(w => ({ x: w.x, y: w.y, w: w.w, h: w.h, z: w.z }))];
  FZ = { canvas: f, pix, texts: TEXTS.slice(), wins, when: new Date() };
}

function hitWin(p) {
  for (const w of FZ.wins) if (inside(p, w)) return { x: w.x, y: w.y, w: w.w, h: w.h };
  return { x: 0, y: 0, w: W, h: H };
}

function openOverlay(mode) {
  if (S.open) return;
  if (REC) { toast('正在录屏，停止录制后再截图', null, 'record'); return; }
  if (!CFG.perm) { showPerm(mode); return; }
  hideMenu();
  freeze();
  for (const c of [frozen, ink]) { c.width = desk.width; c.height = desk.height; }
  frozen.getContext('2d').drawImage(FZ.canvas, 0, 0);
  ic.setTransform(1, 0, 0, 1, 0, 0); ic.clearRect(0, 0, ink.width, ink.height);
  S = { open: true, mode, phase: 'idle', snap: null, sel: null, drag: null, tool: null, color: 0, size: 1, objs: [], redo: [], cur: null, editing: null, mx: mouse.x, my: mouse.y };
  S.snap = hitWin({ x: S.mx, y: S.my });
  ov.dataset.mode = mode;
  ov.hidden = false; ov.classList.remove('out'); ov.classList.add('in');
  setTimeout(() => ov.classList.remove('in'), 120);
  buildBar();
  hint.innerHTML = mode === 'shot'
    ? '<span><b>单击</b>选中窗口</span><span><b>拖动</b>框选</span><span><kbd>F</kbd>全屏</span><span><kbd>Esc</kbd>退出</span>'
    : '<span><b>选择录制区域</b></span><span><b>单击</b>选中窗口</span><span><b>拖动</b>框选</span><span><kbd>F</kbd>全屏</span><span><kbd>Esc</kbd>取消</span>';
  update();
}

function closeOverlay(after) {
  if (!S.open) return;
  S.open = false;
  clearTimeout(S.cdT);
  if (S.editing) { S.editing.el.remove(); S.editing = null; }
  ov.classList.add('out');
  setTimeout(() => { ov.hidden = true; ov.classList.remove('out'); count.hidden = true; busy.hidden = true; cut.querySelector('.sweep')?.remove(); after?.(); }, reduced() ? 0 : 160);
}

/* 当前显示的框：选区前是吸附的窗口，拖动中和选区后是选区 */
function shownRect() {
  if (S.phase === 'idle') return S.drag?.k === 'new' && S.drag.moved ? S.sel : S.snap;
  return S.sel;
}

function update() {
  if (!S.open) return;
  const r = dpr(), rect = shownRect();
  ov.dataset.phase = S.phase;
  ov.dataset.tool = S.tool || '';
  Object.assign(cut.style, { left: rect.x + 'px', top: rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px' });
  cut.classList.toggle('snap', S.phase === 'idle' && !(S.drag?.k === 'new' && S.drag.moved));

  // 尺寸标签（物理像素）
  const showBadge = S.phase === 'idle' || S.phase === 'selected';
  badge.hidden = !showBadge;
  if (showBadge) {
    badge.innerHTML = `<i></i>${Math.round(rect.w * r)}<span class="x">×</span>${Math.round(rect.h * r)}${S.mode === 'rec' ? '<span class="fps">· 30 fps</span>' : ''}`;
    const by = rect.y - 30 >= 4 ? rect.y - 30 : rect.y + 6;
    const bx = clamp(rect.x + (rect.y - 30 >= 4 ? 0 : 6), 4, W - badge.offsetWidth - 4);
    Object.assign(badge.style, { left: bx + 'px', top: by + 'px' });
  }

  // 十字参考线与放大镜：选区前一直跟随光标，选区后只在调整大小时出现
  const dragging = S.drag && (S.drag.k === 'new' || S.drag.k === 'resize');
  const showLoupe = (S.phase === 'idle' || dragging) && !(S.drag?.k === 'move');
  gx.hidden = gy.hidden = !(S.phase === 'idle' && !dragging);
  gx.style.transform = `translateY(${Math.round(S.my)}px)`; gy.style.transform = `translateX(${Math.round(S.mx)}px)`;
  loupe.hidden = !showLoupe;
  if (showLoupe) drawLoupe(dragging ? rect : null);

  hint.hidden = S.phase !== 'idle';
  place();
}

function drawLoupe(rect) {
  const r = dpr(), N = 15, Z = 122 / N;
  lc.imageSmoothingEnabled = false;
  lc.fillStyle = '#000'; lc.fillRect(0, 0, 122, 122);
  lc.drawImage(FZ.canvas, (S.mx - N / 2) * r, (S.my - N / 2) * r, N * r, N * r, 0, 0, 122, 122);
  lc.strokeStyle = 'rgba(255,255,255,.08)'; lc.lineWidth = 1;
  for (let i = 1; i < N; i++) { lc.beginPath(); lc.moveTo(i * Z, 0); lc.lineTo(i * Z, 122); lc.moveTo(0, i * Z); lc.lineTo(122, i * Z); lc.stroke(); }
  const tc = getComputedStyle(ov).getPropertyValue('--tc').trim() || '#FFB84D';
  lc.strokeStyle = tc; lc.lineWidth = 1.5;
  lc.beginPath(); lc.moveTo(61, 0); lc.lineTo(61, 122); lc.moveTo(0, 61); lc.lineTo(122, 61); lc.globalAlpha = .45; lc.stroke(); lc.globalAlpha = 1;
  lc.strokeRect(7 * Z, 7 * Z, Z, Z);
  linfo.innerHTML = rect
    ? `<span>${Math.round(rect.w * r)} × ${Math.round(rect.h * r)}</span>`
    : `<span>X ${Math.round(S.mx * r)}</span><span>Y ${Math.round(S.my * r)}</span>`;
  let x = S.mx + 22, y = S.my + 22;
  if (x + 126 > W - 4) x = S.mx - 22 - 124;
  if (y + 160 > H - 4) y = S.my - 22 - 152;
  Object.assign(loupe.style, { left: x + 'px', top: y + 'px' });
}

      + `<button type="button" data-act="mic" aria-pressed="${micOk && CFG.mic}" ${micOk ? '' : 'aria-disabled="true"'} aria-label="录制麦克风" data-tip="${micOk ? `录制麦克风：${CFG.mic ? '开' : '关'}` : '麦克风需要 macOS 15'}">${svg(micOk && CFG.mic ? 'mic' : 'micOff')}</button>`
      + '<span class="sep"></span>'
      + `<button type="button" data-act="close" aria-label="取消" data-tip="取消  Esc">${svg('close')}</button>`
      + `<button type="button" class="go" data-act="start"><span class="rd"></span>开始录制<kbd>↩</kbd></button>`;
  }
  syncBar();
}

function syncBar() {
  tb.querySelectorAll('[data-tool]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tool === S.tool)));
  const u = tb.querySelector('[data-act="undo"]'), rd = tb.querySelector('[data-act="redo"]');
  if (u) u.setAttribute('aria-disabled', String(!S.objs.length));
  if (rd) rd.setAttribute('aria-disabled', String(!S.redo.length));
  // 颜色 / 粗细
  if (!S.tool) { sub.innerHTML = ''; return; }
  const colors = S.tool !== 'mosaic'
    ? COLORS.map(([c, n], i) => `<button type="button" class="sw" data-color="${i}" aria-pressed="${i === S.color}" aria-label="${n}色" style="--c:${c}"><i></i></button>`).join('') + '<span class="sep"></span>'
    : '';
  const sizes = [0, 1, 2].map(i => {
    const lbl = ['细', '中', '粗'][i];
    const glyph = S.tool === 'text' ? `<b style="--fs:${[11, 14, 18][i]}px">A</b>` : `<i style="width:${[4, 7, 11][i]}px;height:${[4, 7, 11][i]}px"></i>`;
    return `<button type="button" class="sz" data-size="${i}" aria-pressed="${i === S.size}" aria-label="${S.tool === 'text' ? ['小', '中', '大'][i] + '号字' : lbl}">${glyph}</button>`;
  }).join('');
  sub.innerHTML = colors + sizes;
}

function place() {
  const sel = S.sel, show = S.phase === 'selected' && sel;
  tb.hidden = !show;
  sub.hidden = !(show && S.tool);
  busy.hidden = S.phase !== 'busy';
  if (S.phase === 'busy') { Object.assign(busy.style, { left: clamp(sel.x + sel.w - busy.offsetWidth, 8, W - busy.offsetWidth - 8) + 'px', top: S.barY + 'px' }); return; }
  if (!show) return;
  const g = 8, tw = tb.offsetWidth, th = tb.offsetHeight;
  const sw = sub.hidden ? 0 : sub.offsetWidth, sh = sub.hidden ? 0 : sub.offsetHeight + 6;
  let y, above = false;
  if (sel.y + sel.h + g + th + sh + g <= H) y = sel.y + sel.h + g;
  else if (sel.y - g - th - sh >= 0) { y = sel.y - g - th; above = true; }
  else y = sel.y + sel.h - g - th - sh;     // 上下都放不下：放进选区右下角
  const x = clamp(sel.x + sel.w - tw, 8, W - tw - 8);
  S.barY = y;
  Object.assign(tb.style, { left: x + 'px', top: y + 'px' });
  if (above) Object.assign(badge.style, { left: sel.x + 6 + 'px', top: sel.y + 6 + 'px' });   // 工具栏占了选区上方，尺寸标签挪进选区
  tb.classList.toggle('below-tips', y < 44);
  if (!sub.hidden) {
    const btn = tb.querySelector(`[data-tool="${S.tool}"]`);
    const bx = btn ? x + btn.offsetLeft + btn.offsetWidth / 2 - sw / 2 : x;
    Object.assign(sub.style, { left: clamp(bx, 8, W - sw - 8) + 'px', top: (above ? y - sh : y + th + 6) + 'px' });
  }
}

function enterSelected() {
  S.phase = 'selected';
  update();
  tb.classList.remove('pop-in'); void tb.offsetWidth; tb.classList.add('pop-in');
}

tb.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.getAttribute('aria-disabled') === 'true') return;
  if (b.dataset.tool) return toggleTool(b.dataset.tool);
  const a = b.dataset.act;
  if (a === 'undo') undo(); else if (a === 'redo') redo();
  else if (a === 'copy') doCopy(false); else if (a === 'save') doCopy(true);
  else if (a === 'ocr') doOcr(); else if (a === 'pin') doPin(); else if (a === 'close') closeOverlay();
  else if (a === 'start') startCountdown();
  else if (a === 'sys') { CFG.sys = !CFG.sys; buildBar(); syncSettings(); }
  else if (a === 'mic') { CFG.mic = !CFG.mic; buildBar(); syncSettings(); }
});
sub.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.color) S.color = +b.dataset.color;
  if (b.dataset.size) S.size = +b.dataset.size;

});
function toggleTool(t) {
  commitText();
  S.tool = S.tool === t ? null : t;
  syncBar(); update();
  if (!sub.hidden) { sub.classList.remove('pop-in'); void sub.offsetWidth; sub.classList.add('pop-in'); }
}

/* —— 指针 —— */
ov.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !S.open) return;
  if (e.target.closest('.bar, .txt')) return;
  const p = { x: e.clientX, y: e.clientY };
  if (S.editing) { commitText(); if (S.tool === 'text') return; }
  if (S.phase === 'idle') S.drag = { k: 'new', x0: p.x, y0: p.y, moved: false };
  else if (S.phase === 'selected') {
    const h = e.target.dataset?.h;
    if (h) S.drag = { k: 'resize', h, s: { ...S.sel }, x0: p.x, y0: p.y };
    else if (inside(p, S.sel) && S.tool) { if (S.tool === 'text') e.preventDefault(); startDraw(p, e); if (!S.drag) return; }
    else if (inside(p, S.sel)) S.drag = { k: 'move', s: { ...S.sel }, x0: p.x, y0: p.y };
    else return;
  } else return;
  ov.setPointerCapture(e.pointerId);
  update();
});

ov.addEventListener('pointermove', e => {
  if (!S.open) return;
  const p = { x: e.clientX, y: e.clientY };
  S.mx = p.x; S.my = p.y;
  const d = S.drag;
  if (!d) {
    if (S.phase === 'idle') S.snap = hitWin(p);
    setCursor(p);
    if (S.phase === 'idle') update();
    return;
  }
  const dx = Math.round(p.x - d.x0), dy = Math.round(p.y - d.y0);
  if (d.k === 'new') {
    if (!d.moved && Math.hypot(dx, dy) > 3) d.moved = true;
    if (d.moved) S.sel = norm(d.x0, d.y0, p.x, p.y);
  } else if (d.k === 'move') {
    S.sel = { ...d.s, x: clamp(d.s.x + dx, 0, W - d.s.w), y: clamp(d.s.y + dy, 0, H - d.s.h) };
    renderInk();
  } else if (d.k === 'resize') {
    S.sel = resize(d.s, d.h, dx, dy);
    renderInk();
  } else if (d.k === 'draw') {
    extendDraw(p, e);
  }
  update();
});

ov.addEventListener('pointerup', () => {
  const d = S.drag;
  if (!d) return;
  S.drag = null;
  if (d.k === 'new') {
    if (!d.moved || S.sel.w < 4 || S.sel.h < 4) S.sel = { ...S.snap };
    renderInk();
    enterSelected();
    return;
  }
  if (d.k === 'draw') finishDraw();
  update();
});

ov.addEventListener('dblclick', e => {
  if (S.phase !== 'selected' || S.tool || !inside({ x: e.clientX, y: e.clientY }, S.sel) || e.target.closest('.bar')) return;
  S.mode === 'shot' ? doCopy(false) : startCountdown();
});
ov.addEventListener('contextmenu', e => { e.preventDefault(); escape(); });

function setCursor(p) {
  let c = 'crosshair';
  if (S.phase === 'selected') {
    if (S.tool) c = inside(p, S.sel) ? (S.tool === 'text' ? 'text' : 'crosshair') : 'default';
    else c = inside(p, S.sel) ? 'move' : 'default';
  }
  ov.style.cursor = c;
}

function resize(s, h, dx, dy) {
  let x1 = s.x, y1 = s.y, x2 = s.x + s.w, y2 = s.y + s.h;
  if (h.includes('w')) x1 += dx; if (h.includes('e')) x2 += dx;
  if (h.includes('n')) y1 += dy; if (h.includes('s')) y2 += dy;
  const r = norm(x1, y1, x2, y2);
  r.w = Math.max(r.w, 1); r.h = Math.max(r.h, 1);
  return r;
}

function selectAll() {
  if (S.phase !== 'idle' && S.phase !== 'selected') return;
  S.sel = { x: 0, y: 0, w: W, h: H };
  renderInk();
  if (S.phase === 'idle') enterSelected(); else update();
}

/* —— 标注 —— */
function startDraw(p, e) {
  const color = COLORS[S.color][0];
  if (S.tool === 'text') return openText(p);
  if (S.tool === 'step') {
    S.objs.push({ t: 'step', x: p.x, y: p.y, n: S.objs.filter(o => o.t === 'step').length + 1, color, size: S.size });
    S.redo = []; renderInk(); syncBar(); return;
  }
  S.cur = { t: S.tool, color, size: S.size, x0: p.x, y0: p.y, x1: p.x, y1: p.y, pts: [[p.x, p.y]], shift: e.shiftKey };

    mc.setTransform(r, 0, 0, r, 0, 0); mc.fillStyle = mc.strokeStyle = '#000'; mc.lineCap = mc.lineJoin = 'round'; mc.lineWidth = MOSAIC[S.size];

}
function extendDraw(p, e) {
  const o = S.cur; if (!o) return;
  o.x1 = p.x; o.y1 = p.y; o.shift = e.shiftKey;
  const last = o.pts[o.pts.length - 1];
  if ((o.t === 'pen' || o.t === 'mosaic') && Math.hypot(p.x - last[0], p.y - last[1]) > 1.5) {
    o.pts.push([p.x, p.y]);
    if (o.t === 'mosaic') { o.mc.beginPath(); o.mc.moveTo(last[0], last[1]); o.mc.lineTo(p.x, p.y); o.mc.stroke(); o.dirty = true; }
  }

}
function finishDraw() {
  const o = S.cur; S.cur = null;
  if (!o) return;
  const big = Math.abs(o.x1 - o.x0) > 2 || Math.abs(o.y1 - o.y0) > 2;
  if (o.t === 'pen' || o.t === 'mosaic' || big) { delete o.mc; S.objs.push(o); S.redo = []; }

}
function constrain(o) {

  if (o.shift) {

}
function drawArrow(c, x0, y0, x1, y1, s) {

  c.lineTo(wx - nx * hw, wy - ny * hw); c.lineTo(bx - nx * bw, by - ny * bw); c.lineTo(x0 - nx * tw, y0 - ny * tw);

}
function drawObj(c, o) {

    for (let i = 1; i < p.length - 1; i++) c.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
    if (p.length > 1) c.lineTo(p[p.length - 1][0], p[p.length - 1][1]);

    c.fillStyle = o.color === '#FFFFFF' ? '#11131A' : '#FFFFFF';

}
function renderInk() {
  const r = dpr();
  ic.setTransform(1, 0, 0, 1, 0, 0); ic.clearRect(0, 0, ink.width, ink.height);

  ic.setTransform(r, 0, 0, r, 0, 0);
  ic.save(); ic.beginPath(); ic.rect(S.sel.x, S.sel.y, S.sel.w, S.sel.h); ic.clip();

function undo() { commitText(); if (!S.objs.length) return; S.redo.push(S.objs.pop()); renderInk(); syncBar(); }
function redo() { if (!S.redo.length) return; S.objs.push(S.redo.pop()); renderInk(); syncBar(); }

/* 文字标注：单击放置输入框，点别处或 Esc 完成 */
function openText(p) {
  const el = document.createElement('div');
  el.className = 'txt'; el.contentEditable = 'plaintext-only';
  if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true';
  const fs = FONT[S.size], color = COLORS[S.color][0];
  Object.assign(el.style, { left: p.x - 5 + 'px', top: p.y - 3 + 'px', fontSize: fs + 'px', color });
  el.setAttribute('aria-label', '标注文字');
  ov.appendChild(el);
  S.editing = { el, x: p.x, y: p.y, color, size: S.size };
  el.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Escape' || (e.key === 'Enter' && (isMac ? e.metaKey : e.ctrlKey))) { e.preventDefault(); commitText(); }
  });
  el.addEventListener('pointerdown', e => e.stopPropagation());
  el.focus();
}
function commitText() {
  const ed = S.editing; if (!ed) return;
  S.editing = null;
  const text = ed.el.innerText.replace(/\n$/, '');
  ed.el.remove();
  if (text.trim()) { S.objs.push({ t: 'text', x: ed.x, y: ed.y, text, color: ed.color, size: ed.size }); S.redo = []; }
  renderInk(); syncBar();
}

/* —— 输出 —— */
const pad = n => String(n).padStart(2, '0');
const stamp = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}.${pad(d.getMinutes())}`;

function exportPng() { return new Promise(res => exportCanvas().toBlob(res, 'image/png')); }
function exportCanvas() {
  const r = dpr(), s = S.sel;
  const sx = Math.round(s.x * r), sy = Math.round(s.y * r), sw = Math.max(1, Math.round(s.w * r)), sh = Math.max(1, Math.round(s.h * r));
  const out = mk(sw, sh), oc = out.getContext('2d');
  oc.drawImage(FZ.canvas, sx, sy, sw, sh, 0, 0, sw, sh);
  oc.drawImage(ink, sx, sy, sw, sh, 0, 0, sw, sh);
  return out;
}

async function doCopy(save) {
  if (S.phase !== 'selected') return;
  commitText();
  S.phase = 'done';
  const blob = await exportPng();
  const url = URL.createObjectURL(blob), name = `截图 ${stamp(FZ.when)}.png`;
  const copy = !save || CFG.saveCopy;
  if (copy) { try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); } catch { /* 本地文件打开时浏览器可能不允许，忽略 */ } }
  if (save) { const a = document.createElement('a'); a.href = url; a.download = name; a.click(); }
  const finish = () => closeOverlay(() => {
    if (copy) addHist('image', url, name);
    toast(save ? (copy ? `已保存并复制 · ${name}` : `已保存 · ${name}`) : '截图已复制，已加入历史', url);
  });
  if (reduced()) return finish();
  const sw = document.createElement('i'); sw.className = 'sweep'; cut.appendChild(sw);
  update();
  setTimeout(finish, 300);
}

/* 识别文字：按冻结时画面里的文字位置模拟系统 OCR，被前面窗口挡住的不算 */
function ocrText(sel) {
  const vis = FZ.texts.filter(t => {
    const c = { x: t.x + t.w / 2, y: t.y - 6 };
    if (!inside(c, sel)) return false;
    return !FZ.wins.some(w => w.z > t.z && inside(c, w));
  }).sort((a, b) => a.y - b.y || a.x - b.x);
  const lines = [];
  for (const t of vis) {
    const ln = lines.find(l => Math.abs(l.y - t.y) <= 3 && l.z === t.z);
    if (ln) ln.items.push(t); else lines.push({ y: t.y, z: t.z, items: [t] });
  }
  return lines.map(l => {
    l.items.sort((a, b) => a.x - b.x);
    return l.items.reduce((s, t, i) => s + (i && t.x - (l.items[i - 1].x + l.items[i - 1].w) > 6 ? ' ' : '') + t.s, '');
  }).join('\n');
}
function doOcr() {
  if (S.phase !== 'selected') return;
  commitText();
  S.phase = 'busy'; update();
  setTimeout(() => {
    const text = ocrText(S.sel), n = text.replace(/\s/g, '').length;
    if (text) navigator.clipboard?.writeText(text).catch(() => {});
    closeOverlay(() => toast(text ? `已复制图中文字 · ${n} 字` : '选区里没有识别到文字', null, text ? 'check' : 'ocr'));
  }, 900);
}

/* —— 贴图 —— */
const PINS = [];
let pinTop = 15, pinTarget = null;
function doPin() {
  if (S.phase !== 'selected') return;
  commitText();
  S.phase = 'done';
  const cv = exportCanvas(), rect = { ...S.sel };
  makePin(cv, rect);                       // 先放好贴图再淡出遮罩：选区原地“浮起来”，没有跳动
  closeOverlay(() => toast('已钉在屏幕上 · 拖动移动，滚轮缩放，双击关闭', null, 'pin'));
}
function makePin(cv, r) {
  const el = document.createElement('div');

  el.setAttribute('role', 'img'); el.setAttribute('aria-label', '贴图。拖动移动，滚轮缩放，双击或按 Esc 关闭');
  el.innerHTML = `<img alt="" src="${cv.toDataURL('image/png')}"><span class="zoom"></span>`;
  el.style.zIndex = ++pinTop;
  const p = { el, cv, x: r.x, y: r.y, w: r.w, h: r.h, k: 1 };
  PINS.push(p);
  layoutPin(p);
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.classList.remove('lift'), { once: true });

  let d = null, zt;
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    toFront(p);
    d = { x0: e.clientX, y0: e.clientY, px: p.x, py: p.y };
    el.setPointerCapture(e.pointerId); el.classList.add('drag');
  });
  el.addEventListener('pointermove', e => {
    if (!d) return;
    const w = p.w * p.k, h = p.h * p.k;
    p.x = clamp(d.px + e.clientX - d.x0, 40 - w, W - 40);   // 至少留 40 px 在屏幕里，拖不丢
    p.y = clamp(d.py + e.clientY - d.y0, 0, H - 24);
    layoutPin(p);
  });
  el.addEventListener('pointerup', () => { d = null; el.classList.remove('drag'); });
  // 滚轮缩放，以光标为锚点；20%–400%
  el.addEventListener('wheel', e => {
    e.preventDefault();
    const nk = clamp(p.k * (e.deltaY < 0 ? 1.1 : 1 / 1.1), .2, 4);
    const fx = (e.clientX - p.x) / (p.w * p.k), fy = (e.clientY - p.y) / (p.h * p.k);
    p.k = Math.abs(nk - 1) < .04 ? 1 : nk;
    p.x = Math.round(e.clientX - fx * p.w * p.k); p.y = Math.round(e.clientY - fy * p.h * p.k);
    layoutPin(p);
    const z = el.querySelector('.zoom');
    z.textContent = `${Math.round(p.k * 100)}%`; z.classList.add('on');
    clearTimeout(zt); zt = setTimeout(() => z.classList.remove('on'), 900);
  }, { passive: false });
  el.addEventListener('dblclick', () => closePin(p));
  el.addEventListener('contextmenu', e => { e.preventDefault(); toFront(p); openPinMenu(p, e.clientX, e.clientY); });
  el.addEventListener('keydown', e => {
    const mod = isMac ? e.metaKey : e.ctrlKey;
    if (e.key === 'Escape') { e.preventDefault(); closePin(p); }
    else if (mod && e.code === 'KeyC') { e.preventDefault(); copyPin(p); }
    else if (mod && e.code === 'KeyS') { e.preventDefault(); savePin(p); }
    else if (mod && e.code === 'Digit0') { e.preventDefault(); resetPin(p); }
  });
  el.focus({ preventScroll: true });
}
function layoutPin(p) { Object.assign(p.el.style, { left: p.x + 'px', top: p.y + 'px', width: p.w * p.k + 'px', height: p.h * p.k + 'px' }); }
function toFront(p) { p.el.style.zIndex = ++pinTop; PINS.splice(PINS.indexOf(p), 1); PINS.push(p); }
function closePin(p) {
  hideMenu();
  const i = PINS.indexOf(p); if (i < 0) return;
  PINS.splice(i, 1);
  p.el.classList.add('out');
  setTimeout(() => p.el.remove(), reduced() ? 0 : 120);
}
function resetPin(p) { p.k = 1; layoutPin(p); }
function pinBlob(p) { return new Promise(res => p.cv.toBlob(res, 'image/png')); }
async function copyPin(p) {
  const blob = await pinBlob(p), url = URL.createObjectURL(blob);
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); } catch { /* 同截图 */ }
  addHist('image', url, `截图 ${stamp(new Date())}.png`);
  toast('贴图已复制，已加入历史', url);
}
async function savePin(p) {
  const blob = await pinBlob(p), url = URL.createObjectURL(blob), name = `截图 ${stamp(new Date())}.png`;
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  if (CFG.saveCopy) { try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); } catch { /* 同截图 */ } addHist('image', url, name); }
  toast(CFG.saveCopy ? `已保存并复制 · ${name}` : `已保存 · ${name}`, url);
}
function openPinMenu(p, x, y) {
  hideMenu();
  pinTarget = p;
  const m = $('#pinMenu');
  $('#pmReset').hidden = p.k === 1;
  m.hidden = false;
  Object.assign(m.style, { left: clamp(x, 8, W - m.offsetWidth - 8) + 'px', top: clamp(y, 8, H - m.offsetHeight - 8) + 'px' });
  m.querySelector('button').focus();
}
$('#pinMenu').addEventListener('click', e => {
  const b = e.target.closest('[data-pm]'), p = pinTarget;
  if (!b || !p) return;
  hideMenu();
  ({ copy: copyPin, save: savePin, reset: resetPin, close: closePin })[b.dataset.pm](p);
});
$('#pinMenu').addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); hideMenu(); pinTarget?.el.focus(); } });

/* —— 录屏 —— */
let REC = null;
function startCountdown() {
  if (S.phase !== 'selected') return;
  S.phase = 'countdown'; update();
  let n = 3;
  const s = S.sel;
  Object.assign(count.style, { left: s.x + s.w / 2 - 75 + 'px', top: s.y + s.h / 2 - 75 + 'px' });
  count.hidden = false;
  const tick = () => {
    if (S.phase !== 'countdown') return;
    if (n === 0) { count.hidden = true; beginRecording(); return; }
    count.innerHTML = `<svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="68"/><circle class="prg" cx="75" cy="75" r="68"/></svg><b>${n}</b><small>按 Esc 取消</small>`;
    n--; S.cdT = setTimeout(tick, 1000);
  };
  tick();
}
function cancelCountdown() { clearTimeout(S.cdT); count.hidden = true; S.phase = 'selected'; update(); }

function beginRecording() {
  const rect = { ...S.sel };
  closeOverlay();
  REC = { rect, t0: Date.now(), sys: CFG.sys, mic: CFG.os >= 15 && CFG.mic };
  const f = $('#recFrame');
  f.classList.remove('out');
  Object.assign(f.style, { left: rect.x - 3 + 'px', top: rect.y - 3 + 'px', width: rect.w + 6 + 'px', height: rect.h + 6 + 'px' });
  f.hidden = false;
  $('#recTray').hidden = false; positionTray();
  $('#trayInfo').textContent = `正在录屏 · ${REC.sys ? '系统声音' : '无系统声音'}${REC.mic ? ' · 麦克风' : ''}`;
  $('#bRec').classList.add('rec-on'); $('#bRecL').textContent = '停止录制';
  $('#bRec').querySelector('[data-icon]').dataset.icon = 'stop'; paintIcons($('#bRec'));
  tickRec(); REC.iv = setInterval(tickRec, 250);
}
const mmss = ms => { const s = Math.floor(ms / 1000); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
function tickRec() { if (REC) $('#recTime').textContent = mmss(Date.now() - REC.t0); }
function stopRecording() {
  if (!REC) return;
  hideMenu();
  drawDesk();
  const r = dpr(), { x, y, w, h } = REC.rect, tw = 160, th = Math.max(1, Math.round(tw * h / w));
  const t = mk(tw, th); t.getContext('2d').drawImage(desk, x * r, y * r, w * r, h * r, 0, 0, tw, th);
  const thumb = t.toDataURL('image/png'), dur = mmss(Date.now() - REC.t0), name = `录屏 ${stamp(new Date(REC.t0))}.mp4`;
  clearInterval(REC.iv); REC = null;
  const f = $('#recFrame'); f.classList.add('out'); setTimeout(() => { f.hidden = true; }, reduced() ? 0 : 200);
  $('#recTray').hidden = true;
  $('#bRec').classList.remove('rec-on'); $('#bRecL').textContent = '录屏';
  $('#bRec').querySelector('[data-icon]').dataset.icon = 'record'; paintIcons($('#bRec'));
  if (CFG.recCopy) addHist('video', thumb, `${name} · ${dur}`);
  toast(CFG.recCopy ? `录屏已保存并复制 · ${dur}` : `录屏已保存 · ${dur}`, thumb);
}
function positionTray() {
  const t = $('#recTray');
  if (t.hidden || !L?.tray) return;
  t.style.left = L.tray.x + L.tray.w - t.offsetWidth + 'px';
}
$('#recTray').addEventListener('click', e => {
  e.stopPropagation();
  const m = $('#trayMenu');
  if (!m.hidden) return hideMenu();
  m.hidden = false;
  const b = e.currentTarget.getBoundingClientRect();
  Object.assign(m.style, { left: clamp(b.right - m.offsetWidth, 8, W - m.offsetWidth - 8) + 'px', top: b.bottom + 6 + 'px' });
  $('#trayStop').focus();
});
$('#trayStop').addEventListener('click', stopRecording);
function hideMenu() { $('#trayMenu').hidden = true; $('#pinMenu').hidden = true; }
addEventListener('pointerdown', e => { if (!e.target.closest('#trayMenu, #recTray, #pinMenu')) hideMenu(); });

/* —— Esc / 右键：有选区先取消选区，没有选区退出 —— */
function escape() {
  if (!S.open) return;
  if (S.editing) return commitText();
  if (S.phase === 'countdown') return cancelCountdown();
  if (S.phase === 'busy' || S.phase === 'done') return;
  if (S.phase === 'selected') {
    S.phase = 'idle'; S.sel = null; S.objs = []; S.redo = []; S.tool = null; S.drag = null;
    S.snap = hitWin({ x: S.mx, y: S.my });
    renderInk(); syncBar(); setCursor({ x: S.mx, y: S.my }); update();
    return;
  }
  closeOverlay();
}

/* —— 键盘 —— */
addEventListener('keydown', e => {
  if (e.target.closest?.('.hk')) return;              // 设置里正在录制快捷键
  if (hkMatch(e, HK.shot)) { e.preventDefault(); if (!document.querySelector('dialog[open]')) openOverlay('shot'); return; }
  if (hkMatch(e, HK.rec)) { e.preventDefault(); if (REC) stopRecording(); else if (!document.querySelector('dialog[open]')) openOverlay('rec'); return; }
  if (!S.open) return;
  if (S.editing) { if (e.key === 'Escape') { e.preventDefault(); commitText(); } return; }
  const mod = isMac ? e.metaKey : e.ctrlKey;
  if (e.key === 'Escape') { e.preventDefault(); escape(); return; }
  if (S.phase !== 'idle' && S.phase !== 'selected') return;
  if (e.key === 'Enter') { e.preventDefault(); if (S.phase === 'selected') S.mode === 'shot' ? doCopy(false) : startCountdown(); return; }
  if (e.code === 'KeyF' && !mod) { e.preventDefault(); selectAll(); return; }
  if (S.phase !== 'selected') return;
  if (S.mode === 'shot') {
    if (mod && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && e.code === 'KeyS') { e.preventDefault(); doCopy(true); return; }
    if (!mod && e.code === 'KeyO') { e.preventDefault(); doOcr(); return; }
    if (!mod && e.code === 'KeyP') { e.preventDefault(); doPin(); return; }
    const m = /^Digit([1-7])$/.exec(e.code);
    if (!mod && m) { e.preventDefault(); toggleTool(TOOLS[+m[1] - 1][0]); return; }
  }
  const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (dir) {
    e.preventDefault();
    const s = S.sel;
    S.sel = e.shiftKey ? resize(s, 'se', dir[0], dir[1]) : { ...s, x: clamp(s.x + dir[0], 0, W - s.w), y: clamp(s.y + dir[1], 0, H - s.h) };
    renderInk(); update();
  }
});

/* —— 历史（演示）与提示条 —— */
function addHist(type, src, title) {
  const h = $('#hist');
  h.querySelector('.empty')?.remove();
  const t = document.createElement('div');
  t.className = 'tile new'; t.dataset.type = type; t.title = title;
  t.innerHTML = `<img alt="" src="${src}">${type === 'video' ? `<span class="play">${svg('play')}</span>` : ''}`;
  h.prepend(t);
  while (h.children.length > 6) h.lastElementChild.remove();
}
let toastT;
function toast(msg, thumb, icon = 'check') {
  const t = $('#toast');
  $('#toastLead').innerHTML = thumb ? `<img class="t-th" alt="" src="${thumb}">` : `<span class="t-ic">${svg(icon)}</span>`;
  $('#toastMsg').textContent = msg;
  t.dataset.open = 'true';
  clearTimeout(toastT); toastT = setTimeout(() => { t.dataset.open = 'false'; }, 2800);
}

/* —— 权限提示 —— */
function showPerm(mode) {
  const d = $('#perm');
  $('#permT').textContent = mode === 'rec' ? '录屏需要屏幕录制权限' : '截图需要屏幕录制权限';
  const page = CFG.os >= 15 ? '录屏与系统录音' : '屏幕录制';
  $('#permP').innerHTML = isMac
    ? `在“系统设置 › 隐私与安全性 › ${page}”里打开 xPaste，然后退出并重新打开 xPaste。`
    : '系统阻止了屏幕截取。请检查是否有安全软件拦截了 xPaste。';
  openDialog(d);
}
$('#permLater').addEventListener('click', () => closeDialog($('#perm')));
$('#permGo').addEventListener('click', () => { closeDialog($('#perm')); toast('已打开系统设置，授权后重新打开 xPaste', null, 'shield'); });
function openDialog(d) { d.showModal(); requestAnimationFrame(() => d.classList.add('is-shown')); }
function closeDialog(d) { d.classList.remove('is-shown'); setTimeout(() => d.close(), reduced() ? 0 : 150); }
document.querySelectorAll('dialog').forEach(d => d.addEventListener('cancel', e => { e.preventDefault(); closeDialog(d); }));

/* —— 设置 —— */
function syncSettings() {
  $('#hkShot').value = hkLabel(HK.shot); $('#hkRec').value = hkLabel(HK.rec);
  $('#dirShot').value = isMac ? '~/Pictures/xPaste' : '图片\\xPaste';
  $('#dirRec').value = '~/Movies/xPaste';
  $('#swSaveCopy').checked = CFG.saveCopy; $('#swSys').checked = CFG.sys; $('#swRecCopy').checked = CFG.recCopy;
  const micOk = CFG.os >= 15;
  $('#swMic').disabled = !micOk; $('#swMic').checked = micOk && CFG.mic;
  $('#micNote').textContent = micOk ? '同时录下麦克风的声音' : '需要 macOS 15 或更新版本';
  $('#permState').innerHTML = CFG.perm ? `<span class="ok">${svg('check')}已授权</span>` : '<button class="btn sm primary" type="button" id="permFix">前往授权</button>';
  $('#permFix')?.addEventListener('click', () => { closeDialog($('#settings')); toast('已打开系统设置，授权后重新打开 xPaste', null, 'shield'); });
  document.querySelectorAll('.os-mac').forEach(el => { el.hidden = !isMac; });
}
for (const [id, key] of [['#swSaveCopy', 'saveCopy'], ['#swSys', 'sys'], ['#swMic', 'mic'], ['#swRecCopy', 'recCopy']]) {
  $(id).addEventListener('change', e => { CFG[key] = e.target.checked; });
}
for (const [id, key] of [['#hkShot', 'shot'], ['#hkRec', 'rec']]) {
  const el = $(id);
  el.addEventListener('focus', () => { el.value = '按下新的组合键…'; });
  el.addEventListener('blur', () => { el.value = hkLabel(HK[key]); });
  el.addEventListener('keydown', e => {
    e.preventDefault(); e.stopPropagation();
    if (e.key === 'Escape') { el.blur(); return; }
    if (e.key === 'Backspace' || e.key === 'Delete') { HK[key] = ''; el.blur(); paintHK(); return; }
    const s = hkFromEvent(e);
    if (s) { HK[key] = s; paintHK(); el.blur(); }
  });
}
$('#bSet').addEventListener('click', () => { syncSettings(); openDialog($('#settings')); });
$('#setX').addEventListener('click', () => closeDialog($('#settings')));
$('#setDone').addEventListener('click', () => closeDialog($('#settings')));

/* —— 控制台 —— */
$('#bShot').addEventListener('click', () => openOverlay('shot'));
$('#bRec').addEventListener('click', () => REC ? stopRecording() : openOverlay('rec'));
$('#bPerm').addEventListener('click', e => {
  CFG.perm = !CFG.perm;
  e.currentTarget.setAttribute('aria-pressed', String(CFG.perm));
  $('#bPermL').textContent = CFG.perm ? '已授权' : '未授权';
});
$('#bOs').addEventListener('click', e => { CFG.os = CFG.os >= 15 ? 14 : 15; e.currentTarget.textContent = `macOS ${CFG.os}`; });
$('#bRm').addEventListener('click', e => {
  const on = document.documentElement.dataset.rm !== 'on';
  document.documentElement.dataset.rm = on ? 'on' : 'off';
  e.currentTarget.setAttribute('aria-pressed', String(on));
  e.currentTarget.classList.toggle('ghost', !on);
});
$('#bTheme').addEventListener('click', e => {
  const light = document.documentElement.dataset.theme !== 'light';
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  e.currentTarget.querySelector('[data-icon]').dataset.icon = light ? 'sun' : 'moon';
  paintIcons(e.currentTarget);
});
if (!isMac) { $('#bRec').hidden = true; $('#bOs').hidden = true; $('#bPerm').hidden = true; }   // Windows 本期不录屏

/* —— 启动 —— */
addEventListener('resize', () => { if (S.open) { S.open = false; ov.hidden = true; } layout(); });
paintIcons(); paintHK(); layout();
document.fonts?.ready.then(drawDesk);
setInterval(() => { if (!S.open) drawDesk(); }, 200);
</script>
</body>
