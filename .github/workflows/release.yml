name: Release
# 推送 v* 标签（如 v0.1.1）时打三个安装包并发布 GitHub Release。
# 给已有标签补发：Actions → Release → Run workflow，填标签名（用的是默认分支上的这份流程）。
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      tag: { description: "要发布的标签，如 v0.1.0", required: true }
permissions: { contents: write }
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      matrix: { os: [macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      # 官方安装包带上私有的 Pro 代码：PRO_DEPLOY_KEY 是 xpaste-pro 仓库的只读 deploy key。
      # 私有仓库要先打同名标签：同一个标签每次构建都用同一份私有代码，没有这个标签就在这里失败
      - uses: actions/checkout@v4
        with: { repository: Cocoon-break/xpaste-pro, path: pro, ref: "refs/tags/${{ env.TAG }}", ssh-key: "${{ secrets.PRO_DEPLOY_KEY }}" }
      - name: 确认已带上 Pro
        run: test -f pro/rust/mod.rs && test -f pro/web/line.html
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 25, cache: pnpm }
      # macOS 跑在 Apple 芯片上，装上 x86_64 target 后 make release 顺带打 Intel 包
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ runner.os == 'macOS' && 'x86_64-apple-darwin' || '' }}" }
      - uses: swatinem/rust-cache@v2
      - if: runner.os == 'Windows'
        run: command -v make || choco install make -y
      # 系统翻译的 Swift 桥接要 Xcode 26 及以上的 SDK（M26 规则 7）：默认 Xcode 低于 26 时切到 runner 上装的新版
      - if: runner.os == 'macOS'
        name: Xcode 26 及以上
        run: |
          xcodebuild -version
          if [ "$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')" -lt 26 ]; then
            x=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
            [ -n "$x" ] || { echo "runner 上没有 Xcode 26 及以上，系统翻译桥接编译不了：把 macOS 任务的 runs-on 换成 macos-26" >&2; exit 1; }
            sudo xcode-select -s "$x"
            xcodebuild -version
          fi
      - run: make install
      - name: 标签与版本号一致
        run: |
          pnpm check:version
          ver=$(node -p "require('./package.json').version")
          # 内测标签带后缀（v0.8.0-beta.1）：去掉后缀再和版本号比
          test "v$ver" = "${TAG%%-*}" || { echo "标签 $TAG 与 package.json 版本 $ver 不一致" >&2; exit 1; }
      # APPLE_* 来自仓库 Secrets：Tauri 把 .p12 导入临时钥匙串，签名并公证 macOS 包（Windows 上不起作用）
      - run: make release
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # 标记 pro.json.tmp 来自 pro/rust/trial.rs，只有带 Pro 编译的二进制里才有；改名时两处同步
      - name: 确认 Rust 侧带上 Pro
        run: |
          bin=target/release/xpaste
          [ "$RUNNER_OS" = Windows ] && bin=$bin.exe
          grep -a -q 'pro.json.tmp' "$bin" || { echo "$bin 里没有 Pro 标记：Rust 侧没带上 Pro" >&2; exit 1; }
      - name: 前端产物里有晾衣绳页面
        run: test -f dist/pro/web/line.html
      # Tauri 只公证 dmg 里的 .app，dmg 本身只签名：这里再把 dmg 提交公证并附上票据，
      # 系统单独检查下载下来的 dmg 时也认作已公证（Apple 建议公证最外层的分发文件）
      - if: runner.os == 'macOS'
        name: dmg 公证
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for f in target/installers/xPaste_*.dmg; do
            out=$(xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json) || true
            echo "$out"
            id=$(node -p "JSON.parse(process.argv[1]).id" "$out")
            status=$(node -p "JSON.parse(process.argv[1]).status" "$out")
            if [ "$status" != "Accepted" ]; then
              xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
              echo "$f 公证没有通过：$status" >&2
              exit 1
            fi
            xcrun stapler staple "$f"
          done
      # Secrets 缺失或公证没做成时在这里失败，不让未公证的包发出去：dmg 和里面的 .app 都要带公证票据，
      # 且按“浏览器下载的文件”检查时系统放行。
      # 签名团队还要和 pro/rust/genuine.rs 的 TEAM_ID 一致：对不上时 Pro 在所有 Mac 上都悄悄不可用
      - if: runner.os == 'macOS'
        name: dmg 与里面的应用都已公证
        run: |
          want=$(sed -nE 's/^const TEAM_ID: &str = "([A-Z0-9]+)";.*/\1/p' pro/rust/genuine.rs)
          for f in target/installers/xPaste_*.dmg; do
            xcrun stapler validate "$f"
            spctl -a -t open --context context:primary-signature -vv "$f"
            m=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$m" "$f"
            xcrun stapler validate "$m/xPaste.app"
            spctl -a -vv "$m/xPaste.app"
            got=$(codesign -dv "$m/xPaste.app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            [ -n "$want" ] && [ "$got" = "$want" ] || { echo "$f 的签名团队是 ${got:-（读不到）}，genuine.rs 里的 TEAM_ID 是 ${want:-（读不到）}" >&2; exit 1; }
            hdiutil detach "$m"
          done
      # 再存一份不带版本号的文件名，官网用 releases/latest/download/<文件名> 固定链接到最新版
      - name: 不带版本号的副本
        run: |
          ver=$(node -p "require('./package.json').version")
          cd target/installers
          for f in xPaste_*; do cp "$f" "${f/_${ver}_/_}"; done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: target/installers/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: installers-*, merge-multiple: true }
      - name: 安装包齐全
        run: |
          ls -l dist
          for f in xPaste_aarch64.dmg xPaste_x64.dmg xPaste_x64-setup.exe; do
            test -f "dist/$f" || { echo "缺少 $f" >&2; exit 1; }
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: xPaste ${{ env.TAG }}
          # 内测标签（带 -）只建草稿预发布：只有仓库成员看得到，不算最新版，官网下载、检查更新和 Homebrew 都不受影响
          draft: ${{ contains(env.TAG, '-') }}
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ contains(env.TAG, '-') && 'false' || 'true' }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## 下载

            | 电脑 | 安装包 |
            |---|---|
            | Mac · Apple 芯片（macOS 13 及以上） | `xPaste_aarch64.dmg` |
            | Mac · Intel（macOS 13 及以上） | `xPaste_x64.dmg` |
            | Windows 10 21H2 / 11（x64） | `xPaste_x64-setup.exe` |

            带版本号的文件与上面内容相同。用 Homebrew 装的执行 `brew upgrade --cask xpaste` 升级。

            ## 第一次打开

            macOS 安装包已签名并公证，第一次打开时系统会确认一次，点“打开”即可。

            Windows 安装包未签名，提示“Windows 已保护你的电脑”时，点“更多信息 → 仍要运行”。

  # 发布之后更新 Homebrew tap（Cocoon-break/homebrew-tap）里 cask 的版本号与 sha256。
  # 用的是只对 tap 仓库有写权限的 deploy key（仓库 Secret TAP_DEPLOY_KEY），没配置时只发警告。
  # 给旧标签补发时不动 tap，免得把它退回旧版本；这一步失败不影响已经发布的安装包。
  tap:
    needs: release
    # 内测不动 tap（job 级 if 用不了 env，这里照 TAG 的写法重算）
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 更新 cask
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then echo "::warning::没有配置 TAP_DEPLOY_KEY，Homebrew tap 没有更新"; exit 0; fi
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          if [ "$latest" != "$TAG" ]; then echo "$TAG 不是最新版（最新是 $latest），不更新 tap"; exit 0; fi
          ver=${TAG#v}
          sha() { gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "xPaste_${ver}_$1.dmg" -O - | sha256sum | cut -d' ' -f1; }
          arm=$(sha aarch64)
          intel=$(sha x64)
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:Cocoon-break/homebrew-tap.git tap
          cd tap
          sed -i -E \
            -e "s/^(  version )\"[^\"]*\"/\1\"$ver\"/" \
            -e "s/(sha256 arm: +)\"[0-9a-f]{64}\"/\1\"$arm\"/" \
            -e "s/(intel: )\"[0-9a-f]{64}\"/\1\"$intel\"/" \
            Casks/xpaste.rb
          grep -q "version \"$ver\"" Casks/xpaste.rb && grep -q "$arm" Casks/xpaste.rb && grep -q "$intel" Casks/xpaste.rb \
            || { echo "Casks/xpaste.rb 的格式变了，没能改对" >&2; git diff; exit 1; }
          if git diff --quiet; then echo "cask 已经是 $ver"; exit 0; fi
          git diff
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qam "xpaste $ver"
          git push -q origin HEAD
