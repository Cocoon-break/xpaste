name: Release
# 推送 v* 标签（如 v0.1.1）时打三个安装包并发布 GitHub Release。
# 给已有标签补发：Actions → Release → Run workflow，填标签名（用的是默认分支上的这份流程）。
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      tag: { description: "要发布的标签，如 v0.1.0", required: true }
permissions: { contents: write }
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      matrix: { os: [macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 25, cache: pnpm }
      # macOS 跑在 Apple 芯片上，装上 x86_64 target 后 make release 顺带打 Intel 包
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ runner.os == 'macOS' && 'x86_64-apple-darwin' || '' }}" }
      - uses: swatinem/rust-cache@v2
      - if: runner.os == 'Windows'
        run: command -v make || choco install make -y
      # 系统翻译的 Swift 桥接要 Xcode 26 及以上的 SDK（M26 规则 7）：默认 Xcode 低于 26 时切到 runner 上装的新版
      - if: runner.os == 'macOS'
        name: Xcode 26 及以上
        run: |
          xcodebuild -version
          if [ "$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')" -lt 26 ]; then
            x=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
            [ -n "$x" ] || { echo "runner 上没有 Xcode 26 及以上，系统翻译桥接编译不了：把 macOS 任务的 runs-on 换成 macos-26" >&2; exit 1; }
            sudo xcode-select -s "$x"
            xcodebuild -version
          fi
      - run: make install
      - name: 标签与版本号一致
        run: |
          pnpm check:version
          ver=$(node -p "require('./package.json').version")
          test "v$ver" = "$TAG" || { echo "标签 $TAG 与 package.json 版本 $ver 不一致" >&2; exit 1; }
      # APPLE_* 来自仓库 Secrets：Tauri 把 .p12 导入临时钥匙串，签名并公证 macOS 包（Windows 上不起作用）
      - run: make release
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Tauri 只公证 dmg 里的 .app，dmg 本身只签名：这里再把 dmg 提交公证并附上票据，
      # 系统单独检查下载下来的 dmg 时也认作已公证（Apple 建议公证最外层的分发文件）
      - if: runner.os == 'macOS'
        name: dmg 公证
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for f in target/installers/xPaste_*.dmg; do
            out=$(xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json) || true
            echo "$out"
            id=$(node -p "JSON.parse(process.argv[1]).id" "$out")
            status=$(node -p "JSON.parse(process.argv[1]).status" "$out")
            if [ "$status" != "Accepted" ]; then
              xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
              echo "$f 公证没有通过：$status" >&2
              exit 1
            fi
            xcrun stapler staple "$f"
          done
      # Secrets 缺失或公证没做成时在这里失败，不让未公证的包发出去：dmg 和里面的 .app 都要带公证票据，
      # 且按“浏览器下载的文件”检查时系统放行
      - if: runner.os == 'macOS'
        name: dmg 与里面的应用都已公证
        run: |
          for f in target/installers/xPaste_*.dmg; do
            xcrun stapler validate "$f"
            spctl -a -t open --context context:primary-signature -vv "$f"
            m=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$m" "$f"
            xcrun stapler validate "$m/xPaste.app"
            spctl -a -vv "$m/xPaste.app"
            hdiutil detach "$m"
          done
      # 再存一份不带版本号的文件名，官网用 releases/latest/download/<文件名> 固定链接到最新版
      - name: 不带版本号的副本
        run: |
          cd target/installers
          for f in xPaste_*; do cp "$f" "${f/_${TAG#v}_/_}"; done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: target/installers/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: installers-*, merge-multiple: true }
      - name: 安装包齐全
        run: |
          ls -l dist
          for f in xPaste_aarch64.dmg xPaste_x64.dmg xPaste_x64-setup.exe; do
            test -f "dist/$f" || { echo "缺少 $f" >&2; exit 1; }
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: xPaste ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## 下载

            | 电脑 | 安装包 |
            |---|---|
            | Mac · Apple 芯片（macOS 13 及以上） | `xPaste_aarch64.dmg` |
            | Mac · Intel（macOS 13 及以上） | `xPaste_x64.dmg` |
            | Windows 10 21H2 / 11（x64） | `xPaste_x64-setup.exe` |

            带版本号的文件与上面内容相同。

            ## 第一次打开

            macOS 安装包已签名并公证，直接打开即可。从未签名的旧版本（0.6.0 及更早）升级后，“辅助功能”和“屏幕录制”权限要重新授予一次。

            Windows 安装包未签名，提示“Windows 已保护你的电脑”时，点“更多信息 → 仍要运行”。
