name: CI
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
# 同一个 PR 推了新提交就取消还在跑的旧检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # 不生成调试信息：编译、链接更快，缓存更小（测试失败仍有 panic 信息）
  CARGO_PROFILE_DEV_DEBUG: 0
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 25, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      # 只在 main 上写缓存：PR 写的缓存别的 PR 用不到，还要多花近一分钟上传
      - uses: swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - if: runner.os == 'Windows'
        run: command -v make || choco install make -y
      # 系统翻译的 Swift 桥接要 Xcode 26 及以上的 SDK（M26 规则 7）：默认 Xcode 低于 26 时切到 runner 上装的新版
      - if: runner.os == 'macOS'
        name: Xcode 26 及以上
        run: |
          xcodebuild -version
          if [ "$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')" -lt 26 ]; then
            x=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
            [ -n "$x" ] || { echo "runner 上没有 Xcode 26 及以上，系统翻译桥接编译不了：把 macOS 任务的 runs-on 换成 macos-26" >&2; exit 1; }
            sudo xcode-select -s "$x"
            xcodebuild -version
          fi
      - run: make install
      - run: make check
      # PR 不做发布版完整编译（LTO、单编译单元，一次 4–6 分钟）：发布版代码已由 make check 里的 clippy --release 检查；
      # 合并进 main 或手动触发时由 make release 完整编译并打安装包上传
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: make release
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: xpaste-${{ matrix.os }}
          path: target/installers/*
          retention-days: 7
          if-no-files-found: error
