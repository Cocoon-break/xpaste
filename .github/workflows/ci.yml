name: CI
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 25, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: swatinem/rust-cache@v2
      - if: runner.os == 'Windows'
        run: command -v make || choco install make -y
      - run: make install
      # 临时诊断：Windows 上 OCR 集成测试崩溃，逐步打印定位
      - if: runner.os == 'Windows'
        run: cargo test -p xpaste-platform --test ocr -- --nocapture --test-threads=1
        continue-on-error: true
      - run: make check
      - run: make build-check
      # PR 只跑上面的检查；合并进 main 或手动触发才打安装包并上传
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: make release
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: xpaste-${{ matrix.os }}
          path: target/installers/*
          retention-days: 7
          if-no-files-found: error
