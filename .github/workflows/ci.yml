name: CI
on: { push: { branches: [main, dev] }, pull_request: {}, workflow_dispatch: {} }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 25, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: swatinem/rust-cache@v2
      - if: runner.os == 'Windows'
        run: command -v make || choco install make -y
      - run: make install
      - run: make check
      - run: make build-check
      # 推送到 dev 与 PR 只跑上面的检查；main 推送或手动触发才打安装包并上传
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: make release
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: xpaste-${{ matrix.os }}
          path: target/installers/*
          retention-days: 7
          if-no-files-found: error
