<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xPaste</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <section class="window" id="win" data-shown="false" aria-label="xPaste 剪切板历史">
      <div class="glow" id="glow" aria-hidden="true"></div>
      <div class="titlebar" data-tauri-drag-region>
        <b translate="no" data-tauri-drag-region>xPaste</b>
        <span class="sub" data-tauri-drag-region>剪切板历史</span>
        <button class="live" id="pauseBtn" type="button" aria-pressed="false"><i></i><span>正在记录</span></button>
        <div class="ctrls">
          <button class="btn icon ghost" type="button" data-hide aria-label="最小化面板"><span data-icon="min"></span></button>
          <button class="btn icon ghost" type="button" data-hide aria-label="关闭面板"><span data-icon="x"></span></button>
        </div>
      </div>

      <div class="searchbar">
        <label class="search" for="q">
          <span data-icon="search"></span>
          <input id="q" name="q" type="search" placeholder="搜索内容或来源应用，例如“会议”或 Figma…" autocomplete="off" spellcheck="false"
                 role="combobox" aria-controls="list" aria-expanded="true" aria-autocomplete="list" aria-label="搜索剪切板历史">
          <button class="btn icon ghost sm" type="button" id="clearQ" aria-label="清除搜索" hidden><span data-icon="x"></span></button>
          <span class="count" id="count" aria-live="polite"></span>
        </label>
        <button class="btn icon" type="button" id="settingsBtn" aria-label="设置" disabled title="设置将在后续版本提供"><span data-icon="sliders"></span></button>
      </div>

      <div class="spectrum" id="spectrum">
        <div class="sp-head"><span><b>复制频谱</b> · 过去 24 小时，每根光柱是一次复制，越高内容越大</span><span class="stat" id="spStat"></span></div>
        <div class="sp-track" id="spTrack" aria-hidden="true">
          <div id="spBars"></div>
          <div class="sp-cursor" id="spCursor"></div>
          <span class="sp-now"></span>
          <div class="sp-tip" id="spTip"></div>
        </div>
        <div class="sp-axis" id="spAxis" aria-hidden="true"></div>
      </div>

      <div class="tabs-scroll">
        <div class="tabs" id="tabs">
          <div class="tabs-base" id="tabsBase" role="group" aria-label="按类型筛选"></div>
          <div class="tabs-over" id="tabsOver" aria-hidden="true"></div>
        </div>
      </div>

      <div class="body">
        <div class="list" id="list" role="listbox" aria-label="剪切板历史">
          <div class="list-inner">
            <div class="sel-ind" id="ind" aria-hidden="true"></div>
            <div id="rows"></div>
          </div>
        </div>
        <section class="preview" aria-label="预览">
          <header class="phead">
            <div class="ptype" id="ptype"></div>
            <div class="pact">
              <button class="btn icon" type="button" id="pinBtn" aria-label="置顶" aria-pressed="false">
                <span class="swap" data-state="a"><span data-s="a" data-icon="pin"></span><span data-s="b" data-icon="pinFill"></span></span>
              </button>
              <button class="btn icon" type="button" id="delBtn" aria-label="删除"><span data-icon="trash"></span></button>
              <button class="btn icon" type="button" id="moreBtn" aria-label="更多操作" aria-haspopup="menu"><span data-icon="more"></span></button>
              <button class="btn primary" type="button" id="copyBtn">
                <span class="swap" data-state="a"><span data-s="a" data-icon="copy"></span><span data-s="b" data-icon="check"></span></span>复制<kbd>Enter</kbd>
              </button>
            </div>
          </header>
          <div class="pbody" id="pbody"></div>
          <dl class="pmeta" id="pmeta"></dl>
        </section>
      </div>

      <footer class="statusbar">
        <span class="k" id="selHint"></span>
        <span class="k"><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
        <span class="k"><kbd class="mod"></kbd><kbd>1–9</kbd> 快速复制</span>
        <span class="k"><kbd class="mod"></kbd><kbd>P</kbd> 置顶</span>
        <span class="k"><kbd class="mod"></kbd><kbd>←→</kbd> 切换分类</span>
        <span class="k"><kbd>Del</kbd> 删除</span>
        <span class="k"><kbd>Esc</kbd> 隐藏</span>
      </footer>

      <div class="menu" id="menu" role="menu" aria-label="条目操作" data-open="false">
        <button type="button" role="menuitem" data-m="copy" style="--i:0"><span data-icon="copy"></span>复制<kbd>Enter</kbd></button>
        <button type="button" role="menuitem" data-m="pin" style="--i:1"><span data-icon="pin"></span><span id="mPin">置顶</span><kbd class="modp"></kbd></button>
        <div class="sep" role="separator"></div>
        <button type="button" role="menuitem" data-m="del" class="danger" style="--i:2"><span data-icon="trash"></span>删除<kbd>Del</kbd></button>
      </div>

      <div class="toast" id="toast" data-open="false">
        <span class="t-ic" id="toastIc"></span>
        <span id="toastMsg" role="status" aria-live="polite"></span>
        <button class="toast-undo" id="undoBtn" type="button" hidden>
          撤销
          <svg viewBox="0 0 18 18" aria-hidden="true"><circle class="trk" cx="9" cy="9" r="7"/><circle class="prg" id="ring" cx="9" cy="9" r="7"/></svg>
        </button>
      </div>
    </section>

    <dialog id="settings" aria-labelledby="st-title">
      <form id="settingsForm" novalidate>
        <header class="dlg-head">
          <h2 id="st-title">设置</h2>
          <button class="btn icon ghost" type="button" data-close aria-label="关闭设置"><span data-icon="x"></span></button>
        </header>
        <div class="dlg-body">
          <div class="field" style="--i:0">
            <label for="hotkey">唤起快捷键</label>
            <input id="hotkey" name="hotkey" readonly autocomplete="off" spellcheck="false" aria-describedby="hotkeyHelp">
            <p class="help" id="hotkeyHelp">点击输入框，然后按下新的组合键</p>
          </div>
          <div class="cols" style="--i:1">
            <div class="field">
              <label for="retain">历史保留</label>
              <select id="retain" name="retain">
                <option>7 天</option><option selected>30 天</option><option>90 天</option><option>永久</option>
              </select>
            </div>
            <div class="field">
              <label for="limit">最多保存</label>
              <div class="suffix">
                <input id="limit" name="limit" type="number" inputmode="numeric" min="50" max="5000" step="50" value="500" autocomplete="off" aria-describedby="limitErr">
                <span>条</span>
              </div>
              <p class="err" id="limitErr" hidden>请输入 50 到 5000 之间、50 的整数倍</p>
            </div>
          </div>
          <div class="field" style="--i:2">
            <label for="ignore">不记录这些应用</label>
            <input id="ignore" name="ignore" autocomplete="off" spellcheck="false" value="1Password, 钥匙串访问" placeholder="例如：1Password, KeePass…">
          </div>
          <div class="switches" style="--i:3">
            <label class="switch"><span><b>跳过密码与验证码</b><small>来自密码管理器或被标记为敏感的内容不会被记录</small></span><input type="checkbox" id="sensitive" name="sensitive" checked></label>
            <label class="switch"><span><b>复制后移到顶部</b><small>再次使用的条目会排到列表最前</small></span><input type="checkbox" id="moveTop" name="moveTop" checked></label>
            <label class="switch"><span><b>开机时启动</b><small>登录系统后在后台待命</small></span><input type="checkbox" id="autostart" name="autostart" checked></label>
          </div>
        </div>
        <footer class="dlg-foot">
          <button class="btn" type="button" data-close>取消</button>
          <button class="btn primary" type="submit">保存设置</button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
